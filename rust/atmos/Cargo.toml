[package]
name = "bandastation-atmos"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Experimental BandaStation atmosphere compatibility kernel"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
byond = []
simd = []
worker-profile = ["byond"]

[[bin]]
name = "chemistry"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
serde_json = "1"

[[bench]]
name = "atmos_bench"
harness = false
